name: Spielerdaten aktualisieren

# Kein Zeitplan. Zwei Gruende:
#
#   1. Transfermarkt blockt GitHub-Runner zuverlaessig (HTTP 202, spaeter
#      403, auch ueber den Browser-Weg). Vom privaten Anschluss antwortet
#      dieselbe Adresse mit 200 und in 0,6 s statt 4,5 s.
#   2. Aktualisiert wird bei Benutzung, nicht nach Kalender - der Bestand
#      einer abgeschlossenen Saison veraltet ohnehin kaum.
#
# Der verlaessliche Weg ist scripts/update_local.sh vom eigenen Rechner.
# Diese Action bleibt als Reserve und laesst sich von Hand ueber
# "Run workflow" starten, falls die Blockade einmal faellt.
on:
  workflow_dispatch:
    inputs:
      ligen:
        description: "Nur bestimmte Ligen (z. B. buli,buli2). Leer = drei Gruppen."
        required: false
        default: ""
      alle:
        description: "Alle Gruppen statt nur der heutigen (dauert deutlich laenger)"
        type: boolean
        required: false
        default: false
      saison:
        description: "Saison-ID, 2025 = Spielzeit 2025/26"
        required: false
        default: "2025"

permissions:
  contents: write

concurrency:
  group: spielerdaten
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Warum nicht alles jede Nacht?
  #
  # Transfermarkt blockt Rechenzentren: aus einem GitHub-Runner kommt HTTP
  # 202, der Lauf muss also ueber den Browser gehen (~4,5 s je Seite). Alle
  # 33 Ligen am Stueck waeren rund 90 Minuten. Sieben Gruppen gleichzeitig
  # sind schneller - aber gemessen: vier von sieben liefen in HTTP 403, weil
  # so viele parallele Zugriffe aus demselben Adressbereich die Abwehr
  # ausloesen.
  #
  # Deshalb rotierend: jede Nacht drei Gruppen, hoechstens zwei davon
  # gleichzeitig. Der gesamte Bestand ist damit in gut zwei Tagen einmal
  # durch - fuer Marktwerte und Vertragsdaten reichlich - und die Quelle
  # wird spuerbar weniger belastet. Nicht erneuerte Ligen behalten ihren
  # Stand, weil merge_raw.py sie uebernimmt.
  # ---------------------------------------------------------------------
  planen:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        run: |
          import datetime, json, os

          gruppen = [
              {"name": "england",            "ligen": "pl,champ"},
              {"name": "spanien",            "ligen": "laliga,laliga2"},
              {"name": "italien",            "ligen": "seriea,serieb"},
              {"name": "frankreich-benelux", "ligen": "ligue1,ligue2,jupiler,primeira"},
              {"name": "dach",               "ligen": "buli,buli2,oebuli"},
              {"name": "deutschland-3-4",    "ligen": "l3,rl-nord,rl-nordost,rl-west,rl-suedwest,rl-bayern"},
              {"name": "oberliga-nord",      "ligen": "ol-nord,ol-sued,ol-nds,ol-hamburg,ol-bremen,ol-sh,ol-westfalen"},
              {"name": "oberliga-sued",      "ligen": "ol-niederrhein,ol-mittelrhein,ol-hessen,ol-rps,ol-bw,ol-bayern-n,ol-bayern-s"},
          ]

          eigene = "${{ github.event.inputs.ligen }}".strip()
          alle = "${{ github.event.inputs.alle }}" == "true"

          if eigene:
              plan = [{"name": "auswahl", "ligen": eigene}]
          elif alle:
              plan = gruppen
          else:
              # Drei Gruppen je Nacht, versetzt nach Tag im Jahr
              tag = datetime.date.today().timetuple().tm_yday
              plan = [gruppen[(tag * 3 + i) % len(gruppen)] for i in range(3)]

          print("Heutiger Plan:", ", ".join(g["name"] for g in plan))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": plan}) + "\n")

  sammeln:
    needs: planen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false          # eine kaputte Gruppe kippt nicht den Rest
      max-parallel: 2           # mehr loest die Bot-Abwehr aus (gemessen)
      matrix: ${{ fromJSON(needs.planen.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt

      - name: Browser fuer den Stealth-Weg
        run: |
          scrapling install || true
          patchright install --with-deps chromium || patchright install chromium

      - name: Sammeln
        env:
          SCOUT_SAISON: ${{ github.event.inputs.saison || '2025' }}
          TM_DELAY: "2.5"       # ruhigeres Tempo, seit die Abwehr zuschlug
          SCOUT_BUDGET_MIN: "45"
          SCOUT_TARGET: teil-${{ matrix.name }}.json.gz
        run: |
          # --frisch: die Teildatei enthaelt nur diese Gruppe,
          # zusammengefuehrt wird spaeter in merge_raw.py.
          python3 scripts/build_players.py --ligen "${{ matrix.ligen }}" --frisch

      - name: Teilergebnis sichern
        uses: actions/upload-artifact@v4
        with:
          name: teil-${{ matrix.name }}
          path: teil-${{ matrix.name }}.json.gz
          retention-days: 2
          if-no-files-found: warn

  zusammenfuehren:
    needs: sammeln
    if: always()               # auch wenn einzelne Gruppen gescheitert sind
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Teilergebnisse holen
        uses: actions/download-artifact@v4
        with:
          path: teile
          merge-multiple: true

      - name: Zusammenfuehren
        run: python3 scripts/merge_raw.py "teile/*.json.gz"

      - name: Noten und Percentile berechnen
        run: python3 scripts/compute_grades.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/players.json data/players_raw.json.gz
          git diff --staged --quiet && echo "keine Aenderungen" && exit 0
          git commit -m "Spielerdaten aktualisiert"
          git pull --rebase --autostash origin main
          git push
